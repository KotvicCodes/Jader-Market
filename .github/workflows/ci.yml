name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  operator-portability:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm test -- tests/unit/operator-scripts.test.ts tests/unit/admin-setup.test.ts
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: jader
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: jader_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jader -d jader_market_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://jader:synthetic-ci-only@localhost:5432/jader_market_test
      TEST_DATABASE_URL: postgresql://jader:synthetic-ci-only@localhost:5432/jader_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:http
