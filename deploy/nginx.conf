# One exact host, no request/access logging (URLs and cookies are private).
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 308 https://${JADER_HOST}$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name ${JADER_HOST};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host ${JADER_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host ${JADER_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
